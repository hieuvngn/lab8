<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" 
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <title><ui:insert name="title">JSF Application</ui:insert></title>
    <h:outputStylesheet library="css" name="style.css"/>
</h:head>

<h:body>
    <!-- Header -->
    <header class="main-header">
        <div class="container">
            <h:link value="🏠 Trang chủ" outcome="/index.xhtml" styleClass="logo"/>
            <nav class="main-nav">
                <h:link value="Sinh viên" outcome="/sinhvien-list.xhtml" styleClass="nav-link"/>
                <h:link value="Đăng nhập" outcome="/login.xhtml" styleClass="nav-link" rendered="#{not loginBean.loggedIn}"/>
                <h:commandLink value="Đăng xuất" action="#{loginBean.logout}" styleClass="nav-link" rendered="#{loginBean.loggedIn}"/>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <div class="container">
            <ui:insert name="content">Default content</ui:insert>
        </div>
    </main>

    <!-- Footer -->
    <footer class="main-footer">
        <div class="container">
            <p>&copy; 2024 Lab 8 - JSF Application. All rights reserved.</p>
            <p>Developed by Student - IT3242 Công nghệ Java</p>
        </div>
    </footer>
</h:body>
</html>
